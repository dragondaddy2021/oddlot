name: TWSE Endpoint Watchdog

# 每小時 ping TWSE 主端點，恢復時開 GitHub Issue 通知（會自動 email）
# 背景：2026-05-17 起 www.twse.com.tw/exchangeReport/* 全 404，prod cron 已暫停
# 恢復後反註解 daily_recommend.yml 的 schedule 即可

on:
  # 2026-05-26 暫停：TWSE 已恢復，且 GitHub 帳號停權中導致 watchdog 開 issue 失敗
  # 帳號恢復後可反註解 schedule 重啟（或視情況降頻）
  # schedule:
  #   - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check TWSE BWIBBU_d
        id: probe
        run: |
          # 4 天前必為交易日（無論今天星期幾，往前推 4 天必跨過週末），避免週末/假日 NoData
          DATE=$(date -u -d "4 days ago" +%Y%m%d)
          URL="https://www.twse.com.tw/exchangeReport/BWIBBU_d?response=json&date=${DATE}&selectType=ALL"
          # Retry 3 次抓 transient 連線錯誤（curl 000fail 之類）
          for attempt in 1 2 3; do
            STATUS=$(curl -s -o /tmp/body -w "%{http_code}" \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              -H "Referer: https://www.twse.com.tw/" \
              --max-time 15 "$URL" || echo "000")
            SIZE=$(wc -c < /tmp/body 2>/dev/null || echo 0)
            echo "[attempt $attempt] Date=$DATE Status=$STATUS Size=$SIZE"
            [ "$STATUS" = "200" ] && [ "$SIZE" -gt 1000 ] && break
            sleep 5
          done
          if [ "$STATUS" = "200" ] && [ "$SIZE" -gt 1000 ]; then
            echo "result=up" >> $GITHUB_OUTPUT
          else
            echo "result=down" >> $GITHUB_OUTPUT
          fi

      - name: Open issue on recovery (idempotent)
        if: steps.probe.outputs.result == 'up'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}   # 顯式指定 repo，避免 gh CLI 找 git remote
        run: |
          EXISTING=$(gh issue list --label twse-recovered --state open --limit 1 --json number --jq '.[].number')
          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING already open, skipping"
            exit 0
          fi
          gh label create twse-recovered --color 0e8a16 --description "TWSE 端點恢復通知" 2>/dev/null || true
          gh issue create \
            --title "TWSE 主端點已恢復 — 可重啟 daily cron" \
            --label twse-recovered \
            --body "TWSE BWIBBU_d 已重新回應 200。請反註解 .github/workflows/daily_recommend.yml 的 schedule 區塊，手動觸發一次 Daily AI Stock Selection 驗證，視情況補跑 backtest。確認後關掉這個 issue，watchdog 下次再掛時會自動再開新的。"
