name: Daily AI Stock Selection

on:
  schedule:
    # TWSE 對雲端 IP 的封鎖是間歇的（多為早班），一天多排幾班提高抓到「新」資料
    # 的機率。already_exists 只認 fresh row：第一班抓到新就寫入，其餘班次自動 skip
    # （不重打 Claude）；抓不到的班次走 carry-forward 維持綠燈，stale 不擋後班升級。
    # 公開 repo，Actions 免費，多排無成本。cron 為 UTC，台灣 = UTC+8。
    - cron: "0 18 * * *"   # 台灣 02:00
    - cron: "0 20 * * *"   # 台灣 04:00
    - cron: "0 0 * * *"    # 台灣 08:00
    - cron: "0 4 * * *"    # 台灣 12:00
    - cron: "0 8 * * *"    # 台灣 16:00
  workflow_dispatch:        # 手動觸發

jobs:
  select-stocks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic httpx supabase pydantic-settings

      - name: Run daily selection
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python backend/scripts/daily_selection.py
