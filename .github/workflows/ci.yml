name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint with ruff
        working-directory: backend
        run: |
          # 固定版本：ruff 0.16 起預設規則變多，對既有程式碼報錯；升級時需一併處理
          pip install ruff==0.15.22
          ruff check .

      # JWT 驗證的單元測試（不連網、不需要 Supabase）
      - name: Backend unit tests
        working-directory: backend
        run: |
          pip install pytest
          pytest tests -q

      # 已知漏洞掃描。只提醒、不擋 PR（continue-on-error）：新的 CVE 隨時可能出現，
      # 不該讓無關的 PR 因此變紅。看到警告時再評估升級。
      - name: Dependency audit
        continue-on-error: true
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  api-and-e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r tests/requirements-test.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run API tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          TEST_BASE_URL: https://dragondaddy2021.github.io/oddlot
        run: pytest tests/test_api.py -v

      - name: Run Selenium tests
        env:
          TEST_BASE_URL: https://dragondaddy2021.github.io/oddlot
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pytest tests/test_selenium.py -v

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: report.html
          if-no-files-found: ignore
