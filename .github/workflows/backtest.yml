name: Backtest Selection Algorithm

on:
  workflow_dispatch:        # 僅手動觸發（完整跑耗時 3-4 小時）

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 600    # 3 年（36 snapshots × ~15 min）約需 9 小時
    permissions:
      contents: write       # 用於把 picks JSON commit 回 repo（支援跨 run 續跑）

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic httpx supabase pydantic-settings

      - name: Run backtest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python backend/scripts/backtest.py

      # 把 picks JSON + meta commit 回 repo —— 跨 run 續跑機制：若這次因 timeout 中斷，
      # 下次手動觸發時 backtest.py 會自動 skip 已完成的 snapshot。
      # meta JSON 持久化 HOLD_END，確保跨 run 用同一個窗口錨點。
      - name: Commit picks JSON for resume
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/scripts/backtest_picks.json backend/scripts/backtest_picks_meta.json || true
          if git diff --cached --quiet; then
            echo "No new picks to commit"
          else
            git commit -m "chore: backtest picks snapshot from run ${{ github.run_id }} [skip ci]"
            # 拉一次最新 main 再 push，避免被同期 commit 卡到
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

      # Artifact：picks JSON 保 90 天（本機用 --recompute 換指標時下載用）；
      # report markdown 保 30 天供下載閱讀
      - name: Upload picks JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-picks
          path: |
            backend/scripts/backtest_picks.json
            backend/scripts/backtest_picks_meta.json
          retention-days: 90

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: backend/scripts/backtest_results.md
          retention-days: 30
