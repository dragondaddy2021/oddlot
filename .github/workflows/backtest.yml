name: Backtest Selection Algorithm

on:
  workflow_dispatch:        # 僅手動觸發（完整跑耗時 3-4 小時）

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic httpx supabase pydantic-settings

      - name: Run backtest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python backend/scripts/backtest.py

      # 兩個 artifact：picks JSON 保 90 天（要重算 returns 時下載到本機跑 --recompute）；
      # report markdown 保 30 天供下載閱讀
      - name: Upload picks JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-picks
          path: backend/scripts/backtest_picks.json
          retention-days: 90

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: backend/scripts/backtest_results.md
          retention-days: 30
